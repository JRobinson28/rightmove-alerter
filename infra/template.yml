AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rightmove-alerter: scrapes Rightmove rental searches on a schedule and emails
  new listings. Deploy with scripts/deploy.

Parameters:
  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address
    Description: Where alerts (and error alarms) are emailed.
  Searches:
    Type: String
    MinLength: 1
    Description: >
      JSON list of searches, e.g.
      [{"name":"Home","location":"REGION^1498","max-price":1200,"min-bedrooms":1}]
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: How often to check for new listings.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  PermissionsBoundaryArn:
    Type: String
    Description: The bootstrap stack's FunctionPermissionsBoundaryArn output.

Resources:
  SeenListingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AlertsTopic:
    Type: AWS::SNS::Topic

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      Policies:
        - PolicyName: rightmove-alerter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt SeenListingsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  Function:
    Type: AWS::Lambda::Function
    Metadata:
      cfn-lint:
        config:
          # Code is a local path that `aws cloudformation package` uploads.
          ignore_checks: [W3002]
    Properties:
      Runtime: java21
      Architectures: [arm64]
      Handler: rightmove_alerter.handler::handleRequest
      Code: ../target/rightmove-alerter.jar
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref SeenListingsTable
          TOPIC_ARN: !Ref AlertsTopic

  FunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  Schedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: rightmove-alerter
          Arn: !GetAtt Function.Arn
          Input: !Ref Searches

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: rightmove-alerter failed. Check the function's logs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  FunctionName:
    Value: !Ref Function
  TableName:
    Value: !Ref SeenListingsTable
  TopicArn:
    Value: !Ref AlertsTopic
