name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
      - &setup-java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - &setup-clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
      - &cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-${{ runner.os }}-
      - run: clojure -M:lint
      - run: clojure -M:fmt check
      - run: pipx run cfn-lint==1.57.1 infra/bootstrap.yml infra/template.yml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-java
      - *setup-clojure
      - *cache
      - run: clojure -X:test

  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-java
      - *setup-clojure
      - *cache
      - run: >-
          clojure -M:outdated --reporter=format
          --error-format='{{file}}: {{name}} {{version}} -> {{latest-version}}'

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-java
      - *setup-clojure
      - *cache
      - run: scripts/run-acceptance-tests

  deploy:
    name: Deploy
    needs: [lint, test, outdated, acceptance]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - *checkout
      - *setup-java
      - *setup-clojure
      - *cache
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: scripts/deploy
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SEARCHES: ${{ secrets.SEARCHES }}
